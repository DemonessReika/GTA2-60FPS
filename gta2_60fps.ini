[60fps]
; ---- essential stuff for 60 fps to work ----
pump=1
adaptivepump=1
pumpbudget=42
objects=1
camera=1
cameraz=1
forcedirty=1
deadset=1
predirty=1
maxmove=4
arrows=1
arrowsnap=120
; ---- fps cap (only 60 was tested) ----
capfps=60

; ---- render game at 32-bit instead of 16-bit, for improved performance and less compat issue
32bit_mode=1

; ---- main menu use same resolution as in-game ----
skip_intro=0
menu_scale_fix=1
unifyres=1

; ---- resolution override, use at your own risk, widescreen gta 2 lib is probably better choice for res override ----
res_width=0      ; 0 = use registry/manager setting
res_height=0

; ---- extras ----
zoom=1
zoom_offset=0
zoom_step=2048
zoom_max=73728
zoom_min=0
zoom_keys=1

; ---- smoothening of camera when game above 30 fps. disable if you dislike motion of camera of v1.05 in contrast to v1.03
cam_smooth_hermite=1
cam_smooth_hermite_strength=100

; ---- show vehicle/area name only once per game (restart or new game or loading save resets it) ----
banner_dedup=0
banner_dedup_car=0
; ---- make banner for vehicle/area name smaller by % ----
banner_shrink=0
banner_scale=75

; --- show total amount of collectible gta2 logos you collected on level 
collectible_counter=0
; set to 1 if you'd like to see "x tokens out of y", with 0 you get "x tokens collected"
collectible_show_total=0
collectible_msg_ticks=90


; ---- optimizations, pre-heat audio files and load tiles in n(1) manner ----
tilelist_opt=1
audiocache_warmup=1
spawn_object_rendertick_fix_warmup_tick_time=3

; ---- adjusts culling behavior of peds/carts to work with camera interp (also zoom!) ---- 
cull_follow=1

; ---- directx11 and friends, do not edit if you don't know what you are doing ;
nextvblank_alpha=1
flip_present=1
flip_latency=2
flip_suppress_engine=1
flip_staging_ring=3
flip_vsync=1
surf_clawback=1


; ---- diagnostics (default off, set log=0 to log=1 if something feels off, and check .log file) ----
log=0
debug_logic=0
childprofile=0
mapprofile=0
dump_on_crash=0
stall_watchdog=0
; directx flip diagnostics
flip_log=0
