[60fps]
; ---- essential stuff for 60 fps to work ----
pump=1
adaptivepump=1
pumpbudget=42
objects=1
camera=1
cameraz=1
forcedirty=1
deadset=1
predirty=1
maxmove=4
arrows=1
arrowsnap=120
; ---- fps cap (only 60 was tested) ----
capfps=60

; ---- compatibility with gta 2 widescreen fix, 0 = off, 1 = auto if ws fix detected
; broken currently, so keep it at 0, and manually tinker with settings if there are conflicts with widescreen fix
ws_compat=0

; ---- render game at 32-bit instead of 16-bit, for improved performance and less compat issue
32bit_mode=1

; ---- optimizations, pre-heat audio files and load tiles in n(1) manner ----
tilelist_opt=1
audiocache_warmup=1
spawn_object_rendertick_fix_warmup_tick_time=3

; ---- main menu use same resolution as in-game ----
skip_intro=0
menu_scale_fix=1
unifyres=1

; ---- resolution override, use at your own risk, widescreen gta 2 lib is probably better choice for res override ----
res_width=0      ; 0 = use registry/manager setting
res_height=0


; ---- diagnostics (default off, set log=0 to log=1 if something feels off, and check .log file) ----
log=0
debug_logic=0
childprofile=0
mapprofile=0
dump_on_crash=0
stall_watchdog=0

; ---- extras ----
zoom=1
zoom_offset=0
zoom_step=2048
zoom_max=73728
zoom_min=0
zoom_keys=1

; ---- adjusts culling behavior of peds/carts to work with camera interp (also zoom!) ---- 
cull_follow=1

; ---- show vehicle/area name only once per game (restart or new game or loading save resets it) ----
banner_dedup=0
banner_dedup_car=0
; ---- make banner for vehicle/area name smaller by % ----
banner_shrink=0
banner_scale=75
