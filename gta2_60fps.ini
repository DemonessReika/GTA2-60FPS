[60fps]
; ---- essential stuff for 60 fps to work ----
pump=1
adaptivepump=1
pumpbudget=42
objects=1
camera=1
cameraz=1
forcedirty=1
deadset=1
predirty=1
maxmove=4
arrows=1
arrowsnap=120
; ---- fps cap (only 60 was tested) ----
capfps=60

; ---- optimizations, pre-heat audio files and load tiles in n(1) manner ----
tilelist_opt=1
spawn_warmup=1

; ---- main menu use same resolution as in-game ----
unifyres=1

; ---- diagnostics (default off) ----
log=0
debug_logic=0
childprofile=0
mapprofile=0
dump_on_crash=0
stall_watchdog=0

; ---- extras ----
zoom=1
zoom_offset=0
zoom_step=2048
zoom_max=73728
zoom_min=0
zoom_keys=1

; ---- show vehicle/area name only once per game (restart or new game or loading save resets it) ----
banner_dedup=0
banner_dedup_car=0
; ---- make banner for vehicle/area name smaller by % ----
banner_shrink=0
banner_scale=75
